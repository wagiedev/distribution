name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted, wagie-distribution]
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the complete validation boundary
        # The plain runner image does not include ShellCheck.
        # Ubuntu 24.04 packages the version pinned by run-shellcheck.sh.
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends shellcheck
          make test
